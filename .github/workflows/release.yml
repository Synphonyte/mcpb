name: Release

# Publishes the crate to crates.io when a version tag is pushed, and publishes a
# GitHub release whose notes are the changelog's section for that version:
#
#     git tag -a v0.2.0 -m v0.2.0
#     git push origin v0.2.0
#
# The tag has to name the crate's version and CHANGELOG.md has to have a dated
# `## <version> - YYYY-MM-DD` entry for it, so replace `unreleased` there first.
#
# A re-run (workflow_dispatch, or "Re-run jobs") skips publishing a version that
# is already on crates.io and still creates the GitHub release, so a release that
# only failed in its last step can be finished.
#
# One-time setup on crates.io (the crate already exists, so no token is needed):
# Settings → Trusted Publishing → add a GitHub publisher for
# owner `Synphonyte`, repository `mcpb`, workflow `release.yml`.
# The workflow exchanges a short-lived GitHub OIDC token for a crates.io token
# instead of storing one in the repository's secrets.
#
# The whole CI workflow runs before the crate is published, because CI only runs
# on pull requests: a tag pushed straight to main would otherwise ship without
# the format, lint, MSRV, doc, pack and official-CLI checks. The failures that
# matter are the platform-specific ones, which a single runner cannot see, so
# the release calls CI rather than repeating a part of it.
#
# Once the release exists, the `mcpb` binary is built for each platform and
# attached to it, which `cargo binstall mcpb` and the GitHub Action
# (Synphonyte/mcpb-pack) download.

on:
  push:
    tags: ["v*"]
  # For a retry against an existing tag:
  #   gh workflow run release.yml --ref v0.2.0
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mints the crates.io token, nothing else

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never interrupt a publish

env:
  CARGO_TERM_COLOR: always

jobs:
  # The checks CI runs on pull requests, so nothing reaches crates.io that CI
  # would have refused.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A tag that does not name the crate's version, or a changelog without a
      # dated entry for it, is a mistake made before tagging: refuse to publish
      # it rather than ship the wrong version or ship "unreleased" notes.
      - name: Check the tag, the version and the changelog agree
        id: version
        run: |
          name="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name this crate's version v$version"
            exit 1
          fi
          if ! grep -Eq "^## ${version} - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated entry for $version"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # crates.io refuses a version it already has, which would fail this job and
      # keep the release job from running. So look first, and let a re-run finish
      # a release whose publishing already succeeded.
      - name: Look whether the version is already on crates.io
        id: published
        run: |
          name="${{ steps.version.outputs.name }}"
          version="${{ steps.version.outputs.version }}"
          url="https://crates.io/api/v1/crates/$name/$version"
          status="$(curl -s -o /dev/null -w '%{http_code}' -A "mcpb-release-workflow (https://github.com/Synphonyte/mcpb)" "$url" || true)"

          case "$status" in
            200)
              echo "::notice::$name $version is already on crates.io, not publishing it again"
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::could not ask crates.io about $name $version (HTTP $status)"
              exit 1
              ;;
          esac

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.published.outputs.published == 'false'

      - run: cargo publish
        if: steps.published.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Runs only once the crate is really on crates.io, so a release page never
  # claims a version that failed to publish. The notes come from the changelog.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v6

      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version - " '
            index($0, heading) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no notes for $version"
            exit 1
          fi
          cat notes.md

      # The action creates the release for the tag, and updates the existing one
      # on a retry instead of failing.
      - uses: softprops/action-gh-release@v3
        with:
          name: mcpb ${{ github.ref_name }}
          body_path: notes.md

  # Archives named as `[package.metadata.binstall]` in Cargo.toml expects:
  # mcpb-<target>.tgz, or .zip on Windows, with the binary at the top.
  binaries:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl binaries are static, so they run on any Linux; binstall
          # falls back to them on glibc systems.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # to attach the archives to the release
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --locked --bin mcpb --target ${{ matrix.target }}

      - name: Archive the binary
        id: archive
        shell: bash
        run: |
          dir="target/${{ matrix.target }}/release"
          if [ "$RUNNER_OS" = Windows ]; then
            archive="mcpb-${{ matrix.target }}.zip"
            pwsh -NoProfile -Command "Compress-Archive -Force -Path '$dir/mcpb.exe' -DestinationPath '$archive'"
          else
            archive="mcpb-${{ matrix.target }}.tgz"
            tar -czf "$archive" -C "$dir" mcpb
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      # The binary this job built, unpacked from its archive, has to run here.
      - name: Check the archived binary runs
        if: "!contains(matrix.target, 'x86_64-apple')"
        shell: bash
        run: |
          mkdir unpacked
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command "Expand-Archive -Path '${{ steps.archive.outputs.archive }}' -DestinationPath unpacked"
          else
            tar -xzf "${{ steps.archive.outputs.archive }}" -C unpacked
          fi
          ./unpacked/mcpb --version | grep -qx "mcpb ${GITHUB_REF_NAME#v}"

      # --clobber replaces an archive a failed run already attached.
      - name: Attach the archive to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.archive.outputs.archive }}" --clobber

