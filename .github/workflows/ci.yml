name: CI

# Checks every pull request - not every push to main: the release workflow calls
# this whole workflow before it publishes anything, so a push that skips review
# is checked there instead of twice.
#
# A called workflow cannot be given a commit other than the tag's, so the
# release checks the code that is actually published.
#
# The crate branches on the target OS (`Platform::host`, the `.exe` suffix, zip
# file modes), so the tests run on all three platforms; a Mac alone cannot see
# Windows breakage.

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Not `github.workflow` in the group: a called workflow sees the caller's name,
# so the release's group and this one would be the same, and a run that waits
# for itself deadlocks and cancels. Name the group after this workflow instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  # `rust-version` is a promise. `zip` sets its floor - 1.89 today - and the
  # committed lockfile means this checks the versions that were tested and not
  # whatever a dependency released today.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          # A cache of the current toolchain's artifacts is of no use here.
          key: msrv
      - run: cargo test --locked

  # The README is the crate documentation, so this also checks that its example
  # still describes this crate's API.
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # `cargo test` also runs the example in the README.
  test:
    strategy:
      fail-fast: false
      matrix:
        # The arm64 runners build natively, so Linux and Windows arm64 are
        # covered without a cross toolchain.
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-latest,
            windows-latest,
            windows-11-arm,
          ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  # The question every user of this crate has is whether it works for their
  # server on their platform, so this packs a real bundle on each platform and
  # has the protocol's own CLI validate the manifest in it.
  bundles:
    strategy:
      fail-fast: false
      matrix:
        # The arm64 runners build natively, so Linux and Windows arm64 are
        # covered without a cross toolchain.
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-latest,
            windows-latest,
            windows-11-arm,
          ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Pack a bundle of the example binary
        shell: bash
        run: cargo run --locked --example pack

      # macOS builds both Apple architectures without another toolchain, so the
      # cross-target path - a binary that is not this host's - is covered too.
      - name: Pack a bundle for the other macOS architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "$(uname -m)" = arm64 ]; then
            target=x86_64-apple-darwin
            arch=x64
          else
            target=aarch64-apple-darwin
            arch=arm64
          fi
          rustup target add "$target"
          cargo build --quiet --example pack --target "$target"
          cargo run --quiet --example pack -- --executable "target/$target/debug/examples/pack" --arch "$arch"

      # The `mcpb` binary reads a manifest of its own and packs a directory tree,
      # which is what the example above cannot check: it writes its spec in Rust.
      - name: Pack the reference manifest with the mcpb binary
        shell: bash
        run: |
          dir=target/cli-bundle
          rm -rf "$dir" && mkdir -p "$dir/server" "$dir/bundles"
          cp tests/fixtures/calculator-rust.manifest.json "$dir/manifest.json"

          exe=""; [ -f target/debug/examples/pack.exe ] && exe=.exe
          cp "target/debug/examples/pack$exe" "$dir/server/mcp-calculator"
          printf 'a library the binary loads\n' > "$dir/server/libcalculator.dylib"
          printf '*.dylib\n' > "$dir/server/.mcpbignore"
          printf 'a log, which the format leaves out\n' > "$dir/debug.log"

          cargo run --locked --quiet --bin mcpb -- \
            pack "$dir" --arch x64 --tree server -o "target/bundles/cli-reference.mcpb"

          cargo run --locked --quiet --bin mcpb -- validate target/bundles/cli-reference.mcpb
          cargo run --locked --quiet --bin mcpb -- info target/bundles/cli-reference.mcpb \
            | tee target/cli-info.txt
          grep -q 'server/mcp-calculator' target/cli-info.txt
          if grep -q 'libcalculator' target/cli-info.txt; then
            echo "the .mcpbignore of the packed directory did not apply"
            exit 1
          fi

      - name: Check every bundle with the official CLI
        shell: bash
        run: |
          for bundle in target/bundles/*.mcpb; do
            echo "packed $bundle"
            name="$(basename "$bundle" .mcpb)"
            npx -y @anthropic-ai/mcpb@latest unpack "$bundle" "unpacked-$name"
            npx -y @anthropic-ai/mcpb@latest validate "unpacked-$name"
          done
