[package]
categories = ["development-tools", "compression"]
description = "Pack a local MCP server as an MCPB bundle (.mcpb)"
edition = "2024"
keywords = ["mcp", "mcpb", "bundle", "claude", "packaging"]
license = "MIT"
name = "mcpb"
readme = "README.md"
repository = "https://github.com/Synphonyte/mcpb"
rust-version = "1.85"
version = "0.2.0"

[dependencies]
semver = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
jsonschema = "0.63"
tempfile = "3"
